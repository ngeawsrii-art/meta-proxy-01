  <script>
let currentResults = [];

/* =========================
   ค้นหา Facebook Interest
========================= */
async function searchInterest() {

  const keywordEl = document.getElementById("keyword");
  const limitEl = document.getElementById("limit");
  const resultsDiv = document.getElementById("results");
  const errorDiv = document.getElementById("error");
  const loadingDiv = document.getElementById("loading");

  const keyword = keywordEl.value.trim();
  const limit = limitEl.value;

  resultsDiv.innerHTML = "";
  errorDiv.innerHTML = "";
  loadingDiv.innerText = "";

  if (!keyword) {
    errorDiv.innerText = "กรุณาใส่คำค้นหา";
    return;
  }

  loadingDiv.innerText = "กำลังค้นหา...";

  try {

    const response = await fetch(
      `/meta-interest?q=${encodeURIComponent(keyword)}&limit=${limit}`
    );

    const data = await response.json();

    loadingDiv.innerText = "";

    if (!response.ok || data.error) {
      errorDiv.innerText =
        "เกิดข้อผิดพลาด: " +
        JSON.stringify(data.error || data);
      return;
    }

    if (!data.data || data.data.length === 0) {

      currentResults = [];

      resultsDiv.innerHTML =
        '<div class="empty">ไม่พบ Interest ที่ค้นหา</div>';

      return;
    }

    currentResults = data.data;

    data.data.forEach(item => {

      const name = item.name || "ไม่ระบุชื่อ";
      const id = item.id || "ไม่ระบุ ID";

      const path =
        Array.isArray(item.path)
          ? item.path.join(" › ")
          : "ไม่ระบุหมวดหมู่";

      const lower = item.audience_size_lower_bound;
      const upper = item.audience_size_upper_bound;

      let audience = "ไม่ทราบขนาดกลุ่มเป้าหมาย";

      if (lower != null && upper != null) {
        audience =
          `${Number(lower).toLocaleString()} – ${Number(upper).toLocaleString()} คน`;
      }

      const div = document.createElement("div");

      div.className = "result";

      div.innerHTML = `
        <div class="name">
          ${escapeHtml(name)}
        </div>

        <div class="info">
          <span class="label">🆔 Interest ID:</span>
          ${escapeHtml(id)}
        </div>

        <div class="info">
          <span class="label">📂 Path / หมวดหมู่:</span>
          ${escapeHtml(path)}
        </div>

        <div class="info">
          <span class="label">👥 Audience:</span>
          ${audience}
        </div>

        <button type="button" class="copy-btn">
          📋 คัดลอก Interest
        </button>
      `;

      const copyBtn = div.querySelector(".copy-btn");

      copyBtn.addEventListener("click", () => {
        copyInterest(name, copyBtn);
      });

      resultsDiv.appendChild(div);

    });

  } catch (error) {

    loadingDiv.innerText = "";

    errorDiv.innerText =
      "ไม่สามารถเชื่อมต่อ API ได้: " +
      error.message;
  }
}


/* =========================

${prompt}

* ประกันอุบัติเหตุครอบครัว

กฎการตอบ:

* ตอบเฉพาะคำค้น Interest
* 1 รายการต่อ 1 บรรทัด
* ไม่ต้องใส่ตัวเลข
* ไม่ต้องใส่ bullet
* ไม่ต้องใส่คำอธิบาย
* ไม่ต้องใส่เหตุผล
* ไม่ต้องใส่คะแนน

* ห้ามใส่ประเทศ จังหวัด เมือง หรือสถานที่
* ห้ามใส่อายุ เพศ หรืออาชีพ
* ห้ามตอบประเทศไทย
* ห้ามตอบ Thailand
* ห้ามตอบกรุงเทพ
* ห้ามตอบพังงา
* ห้ามตอบภูเก็ต

ตอบเฉพาะคำค้นที่มีความเกี่ยวข้องสูงที่สุด 2–5 รายการ

หากมีคำค้นที่ตรงกับสินค้าโดยตรง ให้เลือกก่อนเสมอ

ห้ามเลือกแบรนด์ บริษัท หรือองค์กร เพียงเพราะ Facebook มี Interest ของสิ่งนั้น
        `
      })

    });

    const data = await response.json();

    if (!response.ok || data.error) {

      resultDiv.innerHTML =
        '<div class="error">เกิดข้อผิดพลาด: ' +
        escapeHtml(JSON.stringify(data.error || data)) +
        '</div>';

      return;
    }

    const text = data.text || "";

    if (!text) {

      resultDiv.innerHTML =
        '<div class="empty">AI ไม่พบ Interest</div>';

      return;
    }


    // =========================
    // 2. ทำความสะอาดรายชื่อ
    // =========================

    const forbiddenWords = [
      "ประเทศไทย",
      "ไทย",
      "Thailand",
      "กรุงเทพ",
      "Bangkok",
      "พังงา",
      "Phang Nga",
      "ภูเก็ต",
      "Phuket",
      "จังหวัด",
      "ประเทศ",
      "อำเภอ",
      "เมือง",
      "สถานที่",
      "Location"
    ];

    const aiInterests = text
      .split(/\r?\n/)
      .map(item =>
        item
          .replace(/^[-•*\d.)]+\s*/, "")
          .trim()
      )
      .filter(Boolean)
      .filter(item =>
        !forbiddenWords.some(word =>
          item.toLowerCase().includes(word.toLowerCase())
        )
      )
      .slice(0, 10);


    if (aiInterests.length === 0) {

      resultDiv.innerHTML =
        '<div class="empty">AI ไม่พบ Interest ที่เหมาะสม</div>';

      return;
    }


    // =========================
    // 3. เอา Interest ไปค้น Facebook
    // =========================

    const facebookResults = await Promise.all(

      aiInterests.map(async (interest) => {

        try {

          const fbResponse = await fetch(
            "/api/meta-interest?q=" +
            encodeURIComponent(interest) +
            "&limit=10"
          );

          const fbData = await fbResponse.json();

          if (!fbResponse.ok || fbData.error) {
            return {
              aiName: interest,
              found: false,
              results: []
            };
          }

          return {
            aiName: interest,
            found: true,
            results: fbData.data || []
          };

        } catch (error) {

          return {
            aiName: interest,
            found: false,
            results: []
          };

        }

      })

    );


    // =========================
// 4. รวมผลที่ Facebook พบ
// =========================

// ใช้ Map เพื่อป้องกัน Interest ID ซ้ำ
const verifiedMap = new Map();

facebookResults.forEach(item => {

  if (!item.results || item.results.length === 0) {
    return;
  }

  // พยายามหาชื่อที่ตรงกับ AI มากที่สุดก่อน
  const exactMatch = item.results.find(result =>
    result.name &&
    result.name.toLowerCase() === item.aiName.toLowerCase()
  );

  const bestResult = exactMatch || item.results[0];

  const interestId = bestResult.id;

  if (!interestId) {
    return;
  }

  // ถ้า Interest ID นี้มีอยู่แล้ว
  if (verifiedMap.has(interestId)) {

    const existing = verifiedMap.get(interestId);

    // รวมชื่อ AI ที่แนะนำเข้าด้วยกัน
    if (!existing.aiNames.includes(item.aiName)) {
      existing.aiNames.push(item.aiName);
    }

  } else {

    // Interest ID นี้ยังไม่เคยพบ
    verifiedMap.set(interestId, {
      ...bestResult,
      aiNames: [item.aiName]
    });

  }

});

const verifiedResults = Array.from(verifiedMap.values());
    
    // =========================
    // 5. แสดงผล
    // =========================

    if (verifiedResults.length === 0) {

  resultDiv.innerHTML = `
    <div class="result">

      <div class="name">
        🤖 AI แนะนำ Interest
      </div>

      <div class="info">

        ${aiInterests.map((interest, index) => `

          <div class="interest-card">

            <div class="interest-number">
              ${index + 1}. ${escapeHtml(interest)}
            </div>

            <div class="error">
              ❌ Facebook ไม่พบ Interest นี้
            </div>

          </div>

        `).join("")}

      </div>

    </div>
  `;

  return;
}


    resultDiv.innerHTML = `

      <div class="result">

        <div class="name">
          🤖 AI แนะนำ + ตรวจสอบ Facebook แล้ว
        </div>

        <div class="info">

          ${verifiedResults.map((item, index) => {

            const audience =
              item.audience_size_lower_bound != null &&
              item.audience_size_upper_bound != null
                ? Number(item.audience_size_lower_bound).toLocaleString() +
                  " – " +
                  Number(item.audience_size_upper_bound).toLocaleString()
                : "ไม่พบข้อมูล";

            const path =
              Array.isArray(item.path)
                ? item.path.join(" > ")
                : "ไม่พบ Path";

            return `

              <div class="interest-card">

                <div class="interest-number">
                  ${index + 1}. ${escapeHtml(item.name || item.aiName)}
                </div>

                <div>
                  <strong>AI แนะนำ:</strong>
                  ${escapeHtml(item.aiNames.join(" / "))}
                </div>

                <div>
                  <strong>Interest ID:</strong>
                  ${escapeHtml(item.id || "-")}
                </div>

                <div>
                  <strong>Audience:</strong>
                  ${escapeHtml(audience)}
                </div>

                <div>
                  <strong>Path:</strong>
                  ${escapeHtml(path)}
                </div>

                <button
                  type="button"
                  class="search-btn"
                  onclick="copyInterest('${escapeHtml(item.name || item.aiName)}', this)"
                >
                  📋 คัดลอก Interest
                </button>

              </div>

            `;

          }).join("")}

        </div>

      </div>

    `;

  } catch (error) {

    resultDiv.innerHTML =
      '<div class="error">เกิดข้อผิดพลาด: ' +
      escapeHtml(error.message) +
      '</div>';

  }

}


/* =========================
   คัดลอก Interest
========================= */
async function copyInterest(name, button) {

  try {

    await navigator.clipboard.writeText(name);

    const oldText = button.innerText;

    button.innerText = "✅ คัดลอกแล้ว";

    setTimeout(() => {
      button.innerText = oldText;
    }, 1500);

  } catch (error) {

    alert("ไม่สามารถคัดลอกได้");

  }
}


/* =========================
   คัดลอกทั้งหมด
========================= */
function copyAllInterests() {

  if (!currentResults || currentResults.length === 0) {

    alert("ยังไม่มี Interest ให้คัดลอก");
    return;

  }

  const names = currentResults
    .map(item => item.name)
    .filter(Boolean);

  navigator.clipboard.writeText(names.join("\n"))
    .then(() => {
      alert("✅ คัดลอก Interest ทั้งหมดแล้ว");
    })
    .catch(() => {
      alert("ไม่สามารถคัดลอกได้");
    });
}


/* =========================
   Export CSV
========================= */
function exportCSV() {

  if (!currentResults || currentResults.length === 0) {

    alert("ยังไม่มีข้อมูลให้ดาวน์โหลด");
    return;

  }

  const header =
    "Interest ID,Interest Name,Path,Audience Lower,Audience Upper";

  const rows = currentResults.map(item => {

    const id = item.id || "";
    const name = item.name || "";

    const path =
      Array.isArray(item.path)
        ? item.path.join(" > ")
        : "";

    const lower =
      item.audience_size_lower_bound ?? "";

    const upper =
      item.audience_size_upper_bound ?? "";

    return [
      id,
      name,
      path,
      lower,
      upper
    ]
      .map(value =>
        `"${String(value).replace(/"/g, '""')}"`
      )
      .join(",");

  });

  const csv =
    "\uFEFF" +
    header +
    "\n" +
    rows.join("\n");

  const blob = new Blob(
    [csv],
    { type: "text/csv;charset=utf-8;" }
  );

  const url =
    URL.createObjectURL(blob);

  const link =
    document.createElement("a");

  link.href = url;
  link.download = "facebook-interest-results.csv";

  document.body.appendChild(link);

  link.click();

  document.body.removeChild(link);

  URL.revokeObjectURL(url);
}


/* =========================
   ป้องกัน HTML injection
========================= */
function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   ทำให้ฟังก์ชันเรียกได้จาก HTML
========================= */
window.searchInterest = searchInterest;
window.getAIInterests = getAIInterests;
window.copyInterest = copyInterest;
window.copyAllInterests = copyAllInterests;
window.exportCSV = exportCSV;
